<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Remo Vibe</title>

    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0ea5e9"> <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="RemoVibe">
    <link rel="apple-touch-icon" href="icons/icon-192x192.png"> <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script type="module">
        // Firebase App (the core Firebase SDK) is always required and must be listed first
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, onSnapshot, collection, query, orderBy, serverTimestamp, Timestamp, where, getDocs, limit, addDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        import { setLogLevel } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js"; 

        // --- Firebase Configuration ---
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {
            apiKey: "AIzaSyDkSWHNkwSZCiEjl-GgM1gnOBS4JJQIfSU",
            authDomain: "remo-vibe.firebaseapp.com",
            projectId: "remo-vibe",
            storageBucket: "remo-vibe.firebasestorage.app", 
            messagingSenderId: "1077727260012",
            appId: "1:1077727260012:web:34eb9c68a068ace5b1d749"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        setLogLevel('debug'); 

        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-remo-vibe';
        let userId = null;
        let currentRoomId = null;
        let unsubscribeRoomListener = null;
        let lastProcessedTimestamp = null; 

        // --- DOM Elements ---
        const modeToggle = document.getElementById('modeToggle');
        const senderControls = document.getElementById('senderControls');
        const receiverControls = document.getElementById('receiverControls');
        const roomIdInput = document.getElementById('roomIdInput');
        const connectButton = document.getElementById('connectButton');
        const vibrationSequenceDisplay = document.getElementById('vibrationSequenceDisplay');
        const sendVibrationButton = document.getElementById('sendVibrationButton');
        const statusMessage = document.getElementById('statusMessage');
        const userIdDisplay = document.getElementById('userIdDisplay');
        const appTitle = document.getElementById('appTitle');

        const LONG_VIBRATION_DURATION = 1000; 
        const SHORT_VIBRATION_DURATION = 250; 
        const PAUSE_DURATION = 200; 

        // --- Authentication ---
        async function initializeAuth() {
            onAuthStateChanged(auth, async (user) => {
                if (user) {
                    userId = user.uid;
                    console.log("User signed in with UID:", userId);
                    userIdDisplay.textContent = `User ID: ${userId}`;
                    updateUIForMode(modeToggle.checked); 
                } else {
                    console.log("User is signed out. Signing in anonymously...");
                    try {
                        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                            await signInWithCustomToken(auth, __initial_auth_token);
                            console.log("Signed in with custom token.");
                        } else {
                            await signInAnonymously(auth);
                            console.log("Signed in anonymously.");
                        }
                    } catch (error) {
                        console.error("Error during sign-in:", error);
                        statusMessage.textContent = `Error: Could not sign in. ${error.message}`;
                        userIdDisplay.textContent = "User ID: Not signed in";
                    }
                }
            });

            if (!auth.currentUser) {
                 if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    try {
                        await signInWithCustomToken(auth, __initial_auth_token);
                    } catch (error) {
                         console.error("Error signing in with custom token on init:", error);
                         await signInAnonymously(auth); 
                    }
                } else {
                    await signInAnonymously(auth);
                }
            }
        }

        function updateUIForMode(isReceiverMode) {
            if (!userId) { 
                statusMessage.textContent = "Authenticating...";
                senderControls.classList.add('hidden');
                receiverControls.classList.add('hidden');
                connectButton.classList.add('hidden');
                return;
            }

            connectButton.classList.remove('hidden');
            if (isReceiverMode) {
                appTitle.textContent = "Remo Vibe (Receiver)";
                senderControls.classList.add('hidden');
                receiverControls.classList.remove('hidden');
                connectButton.textContent = 'Connect to Room';
                statusMessage.textContent = 'Enter Room ID and connect to receive vibrations.';
                if (unsubscribeRoomListener) {
                    unsubscribeRoomListener(); 
                    unsubscribeRoomListener = null;
                }
            } else {
                appTitle.textContent = "Remo Vibe (Sender)";
                senderControls.classList.remove('hidden');
                receiverControls.classList.add('hidden');
                connectButton.textContent = 'Set Room ID';
                statusMessage.textContent = 'Enter Room ID, compose vibration, and send.';
                 if (unsubscribeRoomListener) { 
                    unsubscribeRoomListener();
                    unsubscribeRoomListener = null;
                }
            }
            roomIdInput.value = currentRoomId || ''; 
        }

        modeToggle.addEventListener('change', (e) => {
            updateUIForMode(e.target.checked);
        });

        function canVibrate() {
            if ('vibrate' in navigator) {
                return true;
            }
            statusMessage.textContent = 'Vibration API not supported on this browser/device.';
            console.warn('Vibration API not supported.');
            return false;
        }

        function playVibrationSequence(sequenceString) {
            if (!canVibrate()) return;

            const pattern = [];
            for (let i = 0; i < sequenceString.length; i++) {
                const char = sequenceString[i];
                if (char === '-') {
                    pattern.push(LONG_VIBRATION_DURATION);
                } else if (char === '.') {
                    pattern.push(SHORT_VIBRATION_DURATION);
                }
                if (i < sequenceString.length - 1) {
                    pattern.push(PAUSE_DURATION); 
                }
            }

            if (pattern.length > 0) {
                navigator.vibrate(pattern);
                console.log('Playing vibration:', pattern);
                statusMessage.textContent = `Playing: ${sequenceString}`;
                setTimeout(() => {
                    if (modeToggle.checked) { 
                         statusMessage.textContent = `Connected to Room: ${currentRoomId}. Waiting...`;
                    }
                }, pattern.reduce((a, b) => a + b, 0) + 500); 
            }
        }

        const vibrationButtons = document.querySelectorAll('.vibration-btn');
        vibrationButtons.forEach(button => {
            button.addEventListener('click', () => {
                const type = button.dataset.type;
                const count = parseInt(button.dataset.count || 1);
                let char = '';
                if (type === 'long') char = '-';
                else if (type === 'short') char = '.';
                
                vibrationSequenceDisplay.textContent += char.repeat(count);
            });
        });

        document.getElementById('clearLastButton').addEventListener('click', () => {
            vibrationSequenceDisplay.textContent = vibrationSequenceDisplay.textContent.slice(0, -1);
        });

        document.getElementById('clearAllButton').addEventListener('click', () => {
            vibrationSequenceDisplay.textContent = '';
        });

        sendVibrationButton.addEventListener('click', async () => {
            if (!userId) {
                statusMessage.textContent = "Error: Not signed in. Cannot send.";
                return;
            }
            if (!currentRoomId) {
                statusMessage.textContent = 'Error: Please set a Room ID first.';
                return;
            }
            const sequence = vibrationSequenceDisplay.textContent;
            if (!sequence) {
                statusMessage.textContent = 'Error: Vibration sequence is empty.';
                return;
            }

            try {
                const vibesCollectionRef = collection(db, `artifacts/${appId}/public/data/vibes/${currentRoomId}/messages`);
                await addDoc(vibesCollectionRef, {
                    sequence: sequence,
                    senderId: userId,
                    timestamp: serverTimestamp()
                });
                statusMessage.textContent = `Vibration "${sequence}" sent to Room ${currentRoomId}!`;
                console.log(`Vibration "${sequence}" sent to Room ${currentRoomId}`);
                vibrationSequenceDisplay.textContent = ''; 
            } catch (error) {
                console.error('Error sending vibration:', error);
                statusMessage.textContent = `Error sending vibration: ${error.message}`;
            }
        });

        connectButton.addEventListener('click', () => {
            const inputRoomId = roomIdInput.value.trim();
            if (!inputRoomId) {
                statusMessage.textContent = 'Error: Room ID cannot be empty.';
                return;
            }
            
            currentRoomId = inputRoomId; 

            if (modeToggle.checked) { 
                if (!userId) {
                    statusMessage.textContent = "Error: Not signed in. Cannot connect.";
                    return;
                }
                statusMessage.textContent = `Connecting to Room: ${currentRoomId}...`;
                console.log(`Receiver connecting to room: ${currentRoomId}`);

                if (unsubscribeRoomListener) {
                    unsubscribeRoomListener(); 
                }
                
                lastProcessedTimestamp = Timestamp.now(); 

                const roomMessagesRef = collection(db, `artifacts/${appId}/public/data/vibes/${currentRoomId}/messages`);
                const q = query(roomMessagesRef, orderBy('timestamp', 'desc'), limit(10)); 

                unsubscribeRoomListener = onSnapshot(q, (snapshot) => {
                    if (!modeToggle.checked || roomIdInput.value.trim() !== currentRoomId) {
                        if(unsubscribeRoomListener) unsubscribeRoomListener();
                        return;
                    }
                    statusMessage.textContent = `Connected to Room: ${currentRoomId}. Waiting...`;
                    let newMessagesFound = false;
                    const changes = snapshot.docChanges().reverse(); 

                    changes.forEach((change) => {
                        if (change.type === "added") {
                            const data = change.doc.data();
                            if (data.timestamp && data.timestamp instanceof Timestamp) {
                                if (data.timestamp.toMillis() > (lastProcessedTimestamp ? lastProcessedTimestamp.toMillis() : 0) ) {
                                     if (data.senderId !== userId) { 
                                        console.log('New vibration received:', data.sequence, 'from', data.senderId, 'at', data.timestamp.toDate());
                                        playVibrationSequence(data.sequence);
                                        newMessagesFound = true;
                                     }
                                    if (!lastProcessedTimestamp || data.timestamp.toMillis() > lastProcessedTimestamp.toMillis()) {
                                        lastProcessedTimestamp = data.timestamp;
                                    }
                                }
                            } else {
                                console.warn("Received message without valid timestamp:", data);
                            }
                        }
                    });
                    
                    if (!newMessagesFound && snapshot.docs.length > 0) {
                        const latestDocInSnapshot = snapshot.docs[0].data(); 
                        if (latestDocInSnapshot.timestamp && latestDocInSnapshot.timestamp instanceof Timestamp) {
                            // This logic is subtle and might need adjustment based on exact desired behavior for initial load vs. live updates.
                            // The primary goal is that lastProcessedTimestamp should reflect the newest message handled.
                        }
                    }
                }, (error) => {
                    console.error('Error listening to room:', error);
                    statusMessage.textContent = `Error listening to room: ${error.message}. Try reconnecting.`;
                    if (unsubscribeRoomListener) unsubscribeRoomListener();
                    unsubscribeRoomListener = null;
                });

            } else { 
                statusMessage.textContent = `Room ID set to: ${currentRoomId}. Compose and send.`;
                console.log(`Sender room ID set to: ${currentRoomId}`);
            }
        });
        
        // --- PWA: Service Worker Registration ---
        function registerServiceWorker() {
            if ('serviceWorker' in navigator) {
                // Attempt to register sw.js from the root, with scope '/'
                // This assumes sw.js is in the root directory of your web app.
                navigator.serviceWorker.register('/sw.js', { scope: '/' }) 
                .then((registration) => {
                    console.log('Service Worker registered successfully. Scope:', registration.scope);
                })
                .catch((error) => {
                    console.error('Service Worker registration failed.');
                    console.error('Error Name:', error.name);
                    console.error('Error Message:', error.message);
                    console.error('Full Error Object:', error);

                    if (statusMessage) { 
                        statusMessage.textContent = `PWA Error: SW Reg failed (${error.name || 'Unknown Error'})`;
                    }
                    
                    if (location.protocol !== 'https:' && location.hostname !== 'localhost' && location.hostname !== '127.0.0.1') {
                        console.warn('Service Workers require HTTPS or localhost/127.0.0.1. Current protocol:', location.protocol, 'Hostname:', location.hostname);
                        if (statusMessage) statusMessage.textContent = 'PWA Error: Service Worker requires HTTPS or localhost.';
                    }
                    
                    const swUrl = new URL('sw.js', window.location.origin).toString(); // Ensure sw.js is checked from origin root for this diagnostic
                    console.log('Attempting to fetch sw.js for diagnostics from:', swUrl);
                    fetch(swUrl) 
                        .then(response => {
                            if (!response.ok) {
                                console.error('Could not fetch sw.js for diagnostics. Status:', response.status, response.statusText);
                                if (statusMessage) {
                                    if (response.status === 404) {
                                       statusMessage.textContent = 'PWA Error: sw.js file not found at ' + swUrl;
                                    } else {
                                       statusMessage.textContent = `PWA Error: Could not load sw.js (Status: ${response.status}) from ${swUrl}`;
                                    }
                                }
                            } else {
                                console.log('sw.js fetched successfully for diagnostics. The error might be within sw.js (e.g., syntax error, importScripts failure) or a security policy (CSP).');
                                if (statusMessage && (statusMessage.textContent.startsWith('Welcome') || statusMessage.textContent.includes('HTTPS') || statusMessage.textContent.includes('SW Reg failed'))) {
                                    statusMessage.textContent = 'PWA Error: Problem registering sw.js (file found, check sw.js content/console).';
                                }
                            }
                        })
                        .catch(fetchError => {
                            console.error('Error trying to fetch sw.js for diagnostics:', fetchError);
                            if (statusMessage) statusMessage.textContent = 'PWA Error: Problem verifying sw.js file path (' + swUrl + '). Error: ' + fetchError.message;
                        });
                });
            } else {
                console.log('Service Worker not supported by this browser.');
                if (statusMessage) statusMessage.textContent = 'PWA Feature: Service Worker not supported here.';
            }
        }

        // --- Initial Load ---
        document.addEventListener('DOMContentLoaded', () => {
            initializeAuth(); 
            registerServiceWorker(); // Register the service worker
        });

    </script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        .vibration-btn, #sendVibrationButton, #connectButton, .control-btn {
            transition: background-color 0.2s ease-in-out, transform 0.1s ease-in-out;
        }
        .vibration-btn:active, #sendVibrationButton:active, #connectButton:active, .control-btn:active {
            transform: scale(0.95);
        }
        .switch {
            position: relative;
            display: inline-block;
            width: 60px;
            height: 34px;
        }
        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }
        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #ccc;
            transition: .4s;
            border-radius: 34px;
        }
        .slider:before {
            position: absolute;
            content: "";
            height: 26px;
            width: 26px;
            left: 4px;
            bottom: 4px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }
        input:checked + .slider {
            background-color: #2563eb; 
        }
        input:focus + .slider {
            box-shadow: 0 0 1px #2563eb;
        }
        input:checked + .slider:before {
            transform: translateX(26px);
        }
    </style>
</head>
<body class="bg-gradient-to-br from-slate-900 to-slate-800 text-white min-h-screen flex flex-col items-center justify-center p-4 selection:bg-blue-500 selection:text-white">

    <div class="bg-slate-800 shadow-2xl rounded-xl p-6 md:p-8 w-full max-w-md">
        <h1 id="appTitle" class="text-3xl font-bold text-center mb-6 bg-clip-text text-transparent bg-gradient-to-r from-blue-400 to-purple-500">Remo Vibe</h1>
        <div id="userIdDisplay" class="text-center text-xs text-slate-400 mb-4">User ID: Loading...</div>

        <div class="flex items-center justify-center space-x-3 mb-6">
            <span class="text-slate-300">Sender</span>
            <label class="switch">
                <input type="checkbox" id="modeToggle">
                <span class="slider"></span>
            </label>
            <span class="text-slate-300">Receiver</span>
        </div>

        <div class="mb-4">
            <label for="roomIdInput" class="block text-sm font-medium text-slate-300 mb-1">Room ID (e.g., 1234)</label>
            <input type="text" id="roomIdInput" name="roomIdInput" class="w-full p-3 bg-slate-700 border border-slate-600 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none placeholder-slate-500" placeholder="Enter shared Room ID">
        </div>

        <button id="connectButton" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 px-4 rounded-lg mb-6 hidden">
            Set Room ID
        </button>
        
        <div id="statusMessage" class="text-center text-sm text-slate-400 mb-4 min-h-[20px]">Welcome! Select mode and enter Room ID.</div>

        <div id="senderControls" class="space-y-4">
            <div id="vibrationSequenceDisplay" class="w-full h-16 bg-slate-700 border border-slate-600 rounded-lg p-3 text-2xl flex items-center justify-center font-mono tracking-widest overflow-x-auto whitespace-nowrap" title="Chosen vibration sequence"></div>
            
            <div class="grid grid-cols-3 gap-3">
                <button data-type="long" data-count="1" class="vibration-btn bg-sky-500 hover:bg-sky-600 p-3 rounded-lg text-center">1 Long (-)</button>
                <button data-type="long" data-count="2" class="vibration-btn bg-sky-500 hover:bg-sky-600 p-3 rounded-lg text-center">2 Long (--)</button>
                <button data-type="long" data-count="3" class="vibration-btn bg-sky-500 hover:bg-sky-600 p-3 rounded-lg text-center">3 Long (---)</button>
                <button data-type="long" data-count="4" class="vibration-btn bg-sky-500 hover:bg-sky-600 p-3 rounded-lg text-center">4 Long</button>
                <button data-type="long" data-count="5" class="vibration-btn bg-sky-500 hover:bg-sky-600 p-3 rounded-lg text-center">5 Long</button>
                <button data-type="short" class="vibration-btn bg-teal-500 hover:bg-teal-600 p-3 rounded-lg text-center">Short (.)</button>
            </div>
             <div class="grid grid-cols-3 gap-3">
                <button id="clearLastButton" class="control-btn col-span-1 bg-amber-500 hover:bg-amber-600 p-3 rounded-lg">Backspace</button>
                <button id="clearAllButton" class="control-btn col-span-2 bg-rose-500 hover:bg-rose-600 p-3 rounded-lg">Clear All</button>
            </div>

            <button id="sendVibrationButton" class="w-full bg-gradient-to-r from-purple-600 to-indigo-600 hover:from-purple-700 hover:to-indigo-700 text-white font-bold py-4 px-4 rounded-lg text-lg">
                Send Vibration
            </button>
        </div>

        <div id="receiverControls" class="hidden text-center">
            <p class="text-lg text-slate-300">Listening for vibrations...</p>
            <div class="mt-4 p-4 bg-slate-700 rounded-lg">
                <p>When a vibration is received, your device will vibrate accordingly.</p>
                <p class="text-xs text-slate-500 mt-2">Ensure your device is not on silent mode and has vibration enabled.</p>
            </div>
        </div>
    </div>
    <footer class="text-center text-xs text-slate-500 mt-8">
        Remo Vibe App | Use responsibly.
    </footer>

</body>
</html>
